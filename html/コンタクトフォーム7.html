<div class="form-group">
    <label>お名前 <span style="color: var(--color-highlight);">*</span></label>
    [text* your-name placeholder "山田 太郎"]
</div>

<div class="form-group">
    <label>メールアドレス <span style="color: var(--color-highlight);">*</span></label>
    [email* your-email placeholder "example@email.com"]
</div>

<div class="form-group">
    <label>電話番号</label>
    [tel your-phone placeholder "03-1234-5678"]
</div>

<div class="form-group">
    <label>愛犬の名前・年齢</label>
    [text dog-info placeholder "ポチ・2歳"]
</div>

<div class="form-group">
    <label>メッセージ</label>
    [textarea your-message placeholder "見学希望日時やご質問など"]
</div>

<div class="form-group" style="margin-top: var(--space-sm);">
    [submit class:btn class:btn-primary "送信する 🐾"]
</div>
